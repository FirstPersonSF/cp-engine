[project]
name = "cp-engine-webhook"
version = "0.1.0"
description = "FastAPI webhook for auto-ingesting Fathom meetings into the cp tenant."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cp-engine",
    "supabase>=2.0",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This package is deploy-only; we never publish a wheel.
packages = ["main.py", "clickup_propose.py"]
