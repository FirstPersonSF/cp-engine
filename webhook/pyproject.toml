[project]
name = "cp-engine-webhook"
version = "0.1.0"
description = "FastAPI webhook for auto-ingesting Fathom meetings into the cp tenant."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Exact-pinned to the release version. The Dockerfile installs cp-engine
    # from this repo checkout first, so this pin is a GATE, not a source:
    # if the checkout's cp-engine version doesn't match, `pip install
    # ./webhook` fails loudly instead of silently resolving elsewhere.
    # scripts/release.py bumps this line alongside the other version mirrors.
    "cp-engine==0.101.5",
    "supabase>=2.0",
    "anthropic>=0.40",
    # Error alerting (arch-phase-3, issue #28). Init is env-gated on
    # SENTRY_DSN; the package is only imported when the DSN is set.
    "sentry-sdk[fastapi]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This package is deploy-only; we never publish a wheel.
packages = [
    "main.py",
    "clickup_propose.py",
    "meeting_artifact.py",
    "observability.py",
    "signatures.py",
    "git_ops.py",
    "pipeline.py",
    "routers",
]
