name: cp-engine sync
description: Run one cp-engine sync cycle for a tenant repo
inputs:
  engine-version:
    description: cp-engine version constraint (semver)
    required: false
    default: ""
  python-version:
    description: Python version
    required: false
    default: "3.11"
runs:
  using: composite
  steps:
    - name: Checkout tenant repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: cp-sync
        token: ${{ env.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install cp-engine
      shell: bash
      run: |
        # Install from the engine repo. Pin per inputs.engine-version, or
        # honor the tenant's pyproject pin if input is empty.
        if [ -n "${{ inputs.engine-version }}" ]; then
          pip install "cp-engine${{ inputs.engine-version }}"
        else
          pip install cp-engine
        fi

    - name: Run sync
      shell: bash
      run: cp sync

    - name: Open PR if there are changes
      shell: bash
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          # cp sync produces an in-tree diff; the harness commits and
          # pushes to cp-sync. Auto-merge handled by the tenant's
          # branch-protection rules if configured.
          echo "TODO: implement commit + push to cp-sync branch"
          exit 1
        else
          echo "No changes — sync no-op."
        fi
