[project]
name = "cp-engine"
version = "0.85.1"
description = "Context Protocol Engine — framework for First Person and Canonic CP corpora"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Drew Fiero" },
    { name = "Tony Welch" },
]
dependencies = [
    "jinja2>=3.1",
    "tomlkit>=0.13",
    "packaging>=24.0",
    "click>=8.1",
    "supabase>=2.0",
    "pygithub>=2.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "anthropic>=0.40",
    "pypdf>=4.0",
    "slack-sdk>=3.27",
    "document-ingest[llm,docx,pptx,pdf,spreadsheet,supabase,web,voyage] @ git+https://github.com/FirstPersonSF/1p-component-library.git@dc7eec2#subdirectory=starters/document-ingest",
    "cloud-storage[all] @ git+https://github.com/FirstPersonSF/1p-component-library.git@dc7eec2#subdirectory=integrations/cloud-storage",
    "resilience @ git+https://github.com/FirstPersonSF/1p-component-library.git@94eb35a#subdirectory=patterns/resilience",
    "visual-document-capture @ git+https://github.com/FirstPersonSF/1p-component-library.git@dc7eec2#subdirectory=processors/visual-document-capture",
    "spine-authoring @ git+https://github.com/FirstPersonSF/1p-component-library.git@023e656#subdirectory=services/spine-authoring",
    "inbound-frameworks[anthropic] @ git+https://github.com/FirstPersonSF/1p-component-library.git@3ea70cc#subdirectory=services/inbound-frameworks",
    "voyageai>=0.4",
    # Floor is 2.0 and the bound is deliberate: mcp 2.x renamed
    # FastMCP -> MCPServer, so mcp_server.py does NOT run on 1.x. Keep the
    # upper bound — an unbounded floor is what let 2.0.0 land silently mid-
    # deploy and break the webhook (see docs/2026-07-31-mcp-2x-migration.md).
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # Webhook tests use FastAPI's TestClient against webhook/main.py. These
    # live in the dev extra because the webhook itself is deployed separately
    # (see webhook/pyproject.toml) — we want them on the test path but NOT
    # in the published cp-engine wheel.
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.scripts]
cp = "cp_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The 1p-component-library deps are pinned as git+ direct references
# (subdirectories, not yet on PyPI). Pinning rules — the resolver requires
# IDENTICAL URLs for the same package, so:
#   - document-ingest / cloud-storage / visual-document-capture: pin all
#     to one SHA (currently 6009cfb = Drive export-suffix fix).
#   - resilience: its URL must BYTE-MATCH the resilience URL inside
#     cloud-storage's own pyproject.toml at the pinned cloud-storage SHA
#     (currently @94eb35a — content-identical to HEAD; resilience hasn't
#     changed since). A true single-SHA pin set is impossible while
#     cloud-storage SHA-pins resilience internally (self-referential);
#     the planned library tag scheme (arch-phase-5) removes this dance.
# When bumping: bump the three to the new SHA, then check
# integrations/cloud-storage/pyproject.toml at that SHA and mirror its
# resilience URL here. `uv lock` fails loudly if they diverge.
# Hatchling rejects direct references in project.dependencies unless this
# is explicitly allowed.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cp_engine"]

# The Claude Code plugin lives at /plugin/. It's distributed via
# `/plugin add github:FirstPersonSF/cp-engine?path=plugin`, not via PyPI,
# so it's excluded from the source distribution too.
[tool.hatch.build.targets.sdist]
exclude = [
    "/plugin",
    "/webhook",         # FastAPI service deployed separately to Railway
    "/.venv*",          # local virtualenvs (absolute symlinks break sdist build)
    "/dist",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
