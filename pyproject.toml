[project]
name = "cp-engine"
version = "0.21.0"
description = "Context Protocol Engine — framework for First Person and Canonic CP corpora"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Drew Fiero" },
    { name = "Tony Welch" },
]
dependencies = [
    "jinja2>=3.1",
    "tomlkit>=0.13",
    "packaging>=24.0",
    "click>=8.1",
    "supabase>=2.0",
    "pygithub>=2.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "anthropic>=0.40",
    "slack-sdk>=3.27",
    "document-ingest[llm,docx,pptx,pdf,spreadsheet,supabase,web,voyage] @ git+https://github.com/Canonic-OS/canonic-component-library.git@5efa7e1#subdirectory=starters/document-ingest",
    "cloud-storage[all] @ git+https://github.com/Canonic-OS/canonic-component-library.git@5efa7e1#subdirectory=integrations/cloud-storage",
    "resilience @ git+https://github.com/Canonic-OS/canonic-component-library.git@714acd9#subdirectory=patterns/resilience",
    "voyageai>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # Webhook tests use FastAPI's TestClient against webhook/main.py. These
    # live in the dev extra because the webhook itself is deployed separately
    # (see webhook/pyproject.toml) — we want them on the test path but NOT
    # in the published cp-engine wheel.
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.scripts]
cp = "cp_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# document-ingest / cloud-storage / resilience are pinned as git+ direct
# references (canonic-component-library subdirectories, not yet on PyPI).
# Hatchling rejects direct references in project.dependencies unless this
# is explicitly allowed.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cp_engine"]

# The Claude Code plugin lives at /plugin/. It's distributed via
# `/plugin add github:FirstPersonSF/cp-engine?path=plugin`, not via PyPI,
# so it's excluded from the source distribution too.
[tool.hatch.build.targets.sdist]
exclude = [
    "/plugin",
    "/webhook",         # FastAPI service deployed separately to Railway
    "/.venv*",          # local virtualenvs (absolute symlinks break sdist build)
    "/dist",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
