[project]
name = "cp-engine"
version = "0.8.9"
description = "Context Protocol Engine — framework for First Person and Canonic CP corpora"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Drew Fiero" },
    { name = "Tony Welch" },
]
dependencies = [
    "jinja2>=3.1",
    "tomlkit>=0.13",
    "packaging>=24.0",
    "click>=8.1",
    "supabase>=2.0",
    "pygithub>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
cp = "cp_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_engine"]

# The Claude Code plugin lives at /plugin/. It's distributed via
# `/plugin add github:FirstPersonSF/cp-engine?path=plugin`, not via PyPI,
# so it's excluded from the source distribution too.
[tool.hatch.build.targets.sdist]
exclude = ["/plugin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
