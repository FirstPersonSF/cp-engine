[project]
name = "cp-engine"
version = "0.131.7"
description = "Context Protocol Engine — framework for First Person and Canonic CP corpora"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Drew Fiero" },
    { name = "Tony Welch" },
]
dependencies = [
    "jinja2>=3.1",
    "tomlkit>=0.13",
    "packaging>=24.0",
    "click>=8.1",
    "supabase>=2.0",
    "pygithub>=2.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "anthropic>=0.40",
    "pypdf>=4.0",
    "slack-sdk>=3.27",
    # Declared explicitly even though `document-ingest[docx]` already pulls it
    # in transitively: `cxp wrap --docx` WRITES Word files (#184), so this is a
    # first-class capability of ours, not an artifact of someone else's extra.
    # An undeclared transitive dep vanishes the day that extra is re-scoped.
    "python-docx>=1.1",
    "document-ingest[llm,docx,pptx,pdf,spreadsheet,supabase,web,voyage] @ git+https://github.com/FirstPersonSF/1p-component-library.git@491fa2f#subdirectory=starters/document-ingest",
    "cloud-storage[all] @ git+https://github.com/FirstPersonSF/1p-component-library.git@491fa2f#subdirectory=integrations/cloud-storage",
    "resilience @ git+https://github.com/FirstPersonSF/1p-component-library.git@94eb35a#subdirectory=patterns/resilience",
    "visual-document-capture @ git+https://github.com/FirstPersonSF/1p-component-library.git@491fa2f#subdirectory=processors/visual-document-capture",
    "spine-authoring @ git+https://github.com/FirstPersonSF/1p-component-library.git@811781e#subdirectory=services/spine-authoring",
    "voyageai>=0.4",
    # Floor is 2.0 and the bound is deliberate: mcp 2.x renamed
    # FastMCP -> MCPServer. Keep the upper bound — an unbounded floor is what
    # let 2.0.0 land silently mid-deploy and break the webhook (see
    # docs/2026-07-31-mcp-2x-migration.md). No engine module imports it since
    # the stdio server was retired (step 5b); it stays because the hosted
    # server's tests run from this environment and `mcp_strict` serves it.
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # Webhook tests use FastAPI's TestClient against webhook/main.py. These
    # live in the dev extra because the webhook itself is deployed separately
    # (see webhook/pyproject.toml) — we want them on the test path but NOT
    # in the published cp-engine wheel.
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.scripts]
# Renamed from `cp` (2026-08-22): the old name shadowed /bin/cp on PATH,
# so every bare `cp` in a shell ran this CLI instead of the copy command.
cxp = "cp_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The 1p-component-library deps are pinned as git+ direct references
# (subdirectories, not yet on PyPI). Pinning rules — the resolver requires
# IDENTICAL URLs for the same package, so:
#   - document-ingest / cloud-storage / visual-document-capture: pin all
#     to one SHA (currently 6009cfb = Drive export-suffix fix).
#   - resilience: its URL must BYTE-MATCH the resilience URL inside
#     cloud-storage's own pyproject.toml at the pinned cloud-storage SHA
#     (currently @94eb35a — content-identical to HEAD; resilience hasn't
#     changed since). A true single-SHA pin set is impossible while
#     cloud-storage SHA-pins resilience internally (self-referential);
#     the planned library tag scheme (arch-phase-5) removes this dance.
# When bumping: bump the three to the new SHA, then check
# integrations/cloud-storage/pyproject.toml at that SHA and mirror its
# resilience URL here. `uv lock` fails loudly if they diverge.
# Hatchling rejects direct references in project.dependencies unless this
# is explicitly allowed.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cp_engine"]

# The Claude Code plugin lives at /plugin/. It's distributed via
# `/plugin add github:FirstPersonSF/cp-engine?path=plugin`, not via PyPI,
# so it's excluded from the source distribution too.
[tool.hatch.build.targets.sdist]
exclude = [
    "/plugin",
    "/webhook",         # FastAPI service deployed separately to Railway
    "/.venv*",          # local virtualenvs (absolute symlinks break sdist build)
    "/dist",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
# `prototypes/hosted-mcp` carries the hosted server's own suite, including the
# production control that asserts every verb is declared before the `__main__`
# guard. It was NOT collected until 2026-09-17: nine test files, zero of them
# run by the release gate, which is how #283 shipped — three verbs that
# registered and then raised ModuleNotFoundError on every call.
testpaths = ["tests", "prototypes/hosted-mcp"]
# THIS checkout's `src` first. The shared venv installs cp_engine editable
# from the main clone, so without this a suite run from a git worktree
# silently tested main's code — green runs and failing controls alike
# proved nothing about the branch (2026-09-30).
pythonpath = ["src"]
# No `-q` in addopts (#316): it stacked with the `pytest -q` everyone types,
# and at `-qq` pytest drops the `N passed` summary line — a run killed at 50%
# by a shell timeout then ended on the warnings block and read as complete.
# Pass `-q` on the command line; the summary is how you know the run finished.
# `e2e` (architecture plan step 6): the one test that crosses all four
# deployables — Fathom row → webhook → tenant git → sync → hosted read. It is
# NOT opt-in: unmarked runs (CI's `pytest -q`) include it; `-m e2e` selects it
# alone when you want the round trip and nothing else.
markers = [
    "e2e: end-to-end across webhook, tenant git, sync and the hosted server (runs by default)",
]
